# Configuration d'Avote. Ce fichier remplace celui généré par initdb : les paramètres non cités
# gardent leur valeur par défaut PostgreSQL.

listen_addresses = '*'
port = 5432

# Le back utilise un pool de 10 connexions (HikariCP par défaut) ; marge pour psql et les migrations.
max_connections = 50
shared_buffers = 128MB

# Dates et journaux en UTC
timezone = 'UTC'
log_timezone = 'UTC'

# Journalise les requêtes lentes (ms) et identifie utilisateur et base dans chaque ligne
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
