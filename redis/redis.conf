# Redis utilisé uniquement comme cache : les données sont reconstructibles, rien n'est persisté.
bind 0.0.0.0
port 6379
protected-mode yes

save ""
appendonly no

# Plafond mémoire ; à l'atteinte, les clés les moins utilisées sont évincées.
maxmemory 128mb
maxmemory-policy allkeys-lru

# Le mot de passe (requirepass) est fourni au démarrage par docker-entrypoint.sh.
